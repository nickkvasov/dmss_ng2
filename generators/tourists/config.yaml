# Tourist Generator Configuration
# This file configures the tourist behavior generator for different cities and tourist types

# City configuration (should match POI generator)
city_bounds:
  name: "New York City"
  min_lat: 40.7
  max_lat: 40.8
  min_lon: -74.0
  max_lon: -73.9

# Tourist types and their characteristics
tourist_types:
  cultural_tourist:
    description: "Tourists interested in museums, historic sites, and cultural experiences"
    percentage: 25
    preferences:
      - museums
      - historic_sites
      - monuments
      - theaters
    behavior_patterns:
      - "spends_2_4_hours_per_poi"
      - "visits_3_5_pois_per_day"
      - "prefers_morning_visits"
      - "takes_photos_frequently"
      - "reads_descriptions"
    demographics:
      age_range: [25, 65]
      group_size: [1, 4]
      stay_duration: [3, 7]  # days
      budget_level: "medium_to_high"

  leisure_tourist:
    description: "Tourists focused on relaxation, parks, and casual activities"
    percentage: 30
    preferences:
      - parks
      - landmarks
      - restaurants
    behavior_patterns:
      - "spends_1_3_hours_per_poi"
      - "visits_2_4_pois_per_day"
      - "prefers_afternoon_visits"
      - "enjoys_outdoor_activities"
      - "casual_pace"
    demographics:
      age_range: [20, 50]
      group_size: [2, 6]
      stay_duration: [2, 5]  # days
      budget_level: "medium"

  adventure_tourist:
    description: "Tourists seeking unique experiences and off-the-beaten-path locations"
    percentage: 15
    preferences:
      - landmarks
      - historic_sites
      - monuments
    behavior_patterns:
      - "spends_1_2_hours_per_poi"
      - "visits_5_8_pois_per_day"
      - "prefers_early_morning_visits"
      - "explores_quickly"
      - "seeks_unique_angles"
    demographics:
      age_range: [18, 40]
      group_size: [1, 3]
      stay_duration: [4, 10]  # days
      budget_level: "low_to_medium"

  family_tourist:
    description: "Families with children visiting family-friendly attractions"
    percentage: 20
    preferences:
      - parks
      - museums
      - landmarks
    behavior_patterns:
      - "spends_2_5_hours_per_poi"
      - "visits_1_3_pois_per_day"
      - "prefers_mid_morning_visits"
      - "frequent_breaks"
      - "educational_focus"
    demographics:
      age_range: [5, 50]
      group_size: [3, 8]
      stay_duration: [3, 6]  # days
      budget_level: "medium_to_high"

  business_tourist:
    description: "Business travelers with limited time for sightseeing"
    percentage: 10
    preferences:
      - landmarks
      - historic_sites
      - monuments
    behavior_patterns:
      - "spends_30_min_1_hour_per_poi"
      - "visits_1_2_pois_per_day"
      - "prefers_evening_visits"
      - "quick_photos"
      - "efficient_routing"
    demographics:
      age_range: [25, 55]
      group_size: [1, 2]
      stay_duration: [1, 3]  # days
      budget_level: "high"

# Behavior patterns configuration
behavior_patterns:
  visit_duration:
    quick: [0.25, 1.0]      # 15 minutes to 1 hour
    normal: [1.0, 3.0]      # 1 to 3 hours
    extended: [3.0, 6.0]    # 3 to 6 hours
    full_day: [6.0, 12.0]   # 6 to 12 hours

  daily_poi_count:
    low: [1, 2]
    medium: [2, 4]
    high: [4, 6]
    very_high: [6, 10]

  visit_times:
    early_morning: [6, 10]   # 6 AM to 10 AM
    morning: [9, 12]         # 9 AM to 12 PM
    afternoon: [12, 17]      # 12 PM to 5 PM
    evening: [17, 22]        # 5 PM to 10 PM
    night: [22, 6]           # 10 PM to 6 AM

# Seasonal patterns
seasonal_patterns:
  spring:
    multiplier: 1.2
    preferred_activities: ["parks", "landmarks"]
  summer:
    multiplier: 1.5
    preferred_activities: ["parks", "landmarks", "museums"]
  fall:
    multiplier: 1.1
    preferred_activities: ["historic_sites", "museums"]
  winter:
    multiplier: 0.8
    preferred_activities: ["museums", "theaters"]

# Generation parameters
generation:
  total_tourists: 1000
  date_range:
    start_date: "2024-01-01"
    end_date: "2024-12-31"
  time_zone: "America/New_York"
  
# Output configuration
output:
  format: ["json", "csv"]
  include_metadata: true
  compress_output: false
