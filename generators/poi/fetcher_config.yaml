# POI Fetcher Configuration
# Configure data sources and API settings for fetching real POI data

# Data sources configuration
sources:
  osm:
    name: "OpenStreetMap"
    api_url: "https://overpass-api.de/api/interpreter"
    rate_limit: 1.0  # requests per second
    categories:
      - "amenity"
      - "tourism"
      - "leisure"
      - "shop"
  
  opentripmap:
    name: "OpenTripMap"
    api_url: "https://api.opentripmap.com/0.1/en/places"
    api_key: null  # Set your API key here or use environment variable
    rate_limit: 2.0  # requests per second
    categories:
      - "historic"
      - "cultural"
      - "natural"
      - "entertainment"
      - "architecture"
      - "museums"
      - "theatres_and_entertainments"
      - "sport"
      - "tourist_facilities"
      - "amusements"
      - "urban_environment"

# Area definitions for easy fetching
areas:
  new_york:
    name: "New York City"
    bounds:
      min_lat: 40.7
      max_lat: 40.8
      min_lon: -74.0
      max_lon: -73.9
  
  london:
    name: "London"
    bounds:
      min_lat: 51.4
      max_lat: 51.6
      min_lon: -0.2
      max_lon: 0.1
  
  paris:
    name: "Paris"
    bounds:
      min_lat: 48.8
      max_lat: 48.9
      min_lon: 2.3
      max_lon: 2.4
  
  tokyo:
    name: "Tokyo"
    bounds:
      min_lat: 35.6
      max_lat: 35.8
      min_lon: 139.6
      max_lon: 139.8
  
  san_francisco:
    name: "San Francisco"
    bounds:
      min_lat: 37.7
      max_lat: 37.8
      min_lon: -122.5
      max_lon: -122.4
  
  barcelona:
    name: "Barcelona"
    bounds:
      min_lat: 41.3
      max_lat: 41.5
      min_lon: 2.1
      max_lon: 2.2

# Default settings
default_bounds:
  min_lat: 40.7
  max_lat: 40.8
  min_lon: -74.0
  max_lon: -73.9

# Output settings
output:
  directory: "data/generated"
  formats:
    - "json"
    - "csv"
  save_by_category: true
  save_config: true
